name: monday-m365-platform

networks:
  monday_network:
    driver: bridge

volumes:
  monday_pgdata:
  monday_redisdata:

services:
  monday_postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: monday_user
      POSTGRES_PASSWORD: monday_pass_2026
      POSTGRES_DB: monday_db
    volumes:
      - monday_pgdata:/var/lib/postgresql/data
    networks:
      - monday_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monday_user -d monday_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  monday_redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-monday_redis_sec_2026}"
    volumes:
      - monday_redisdata:/data
    networks:
      - monday_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-monday_redis_sec_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  monday_api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://monday_user:${POSTGRES_PASSWORD:-monday_pass_2026}@monday_postgres:5432/monday_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-monday_redis_sec_2026}@monday_redis:6379
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-monday_m365_jwt_secret_key_prod_2026}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    volumes:
      - ./Desarrollos:/app/Desarrollos
    depends_on:
      monday_postgres:
        condition: service_healthy
      monday_redis:
        condition: service_healthy
    networks:
      - monday_network

  monday_web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - monday_api
    networks:
      - monday_network
